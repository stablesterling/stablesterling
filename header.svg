<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#181736"/>
      <stop offset="55%" stop-color="#0a0f26"/>
      <stop offset="100%" stop-color="#0c0d29"/>
    </radialGradient>
    <linearGradient id="blobA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b03a24"/>
      <stop offset="100%" stop-color="#ff6d41"/>
    </linearGradient>
    <linearGradient id="blobB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6d41"/>
      <stop offset="100%" stop-color="#ffb37a"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1.4 0; 1.4 0; -1.4 0" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ff6d41" flood-opacity="0.85"/>
    </filter>
    <mask id="titleMask">
      <text x="600" y="208" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="88" font-weight="700" letter-spacing="14" fill="#ffffff">ABHIRAM UNNI</text>
    </mask>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6d41" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#fb834b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fb834b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- drifting violet blobs : shader-gradient vibe, mk4 -->
  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="300" cy="180" rx="260" ry="150" fill="url(#blobA)">
      <animate attributeName="cx" values="300;540;300" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;110;180" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="900" cy="250" rx="280" ry="160" fill="url(#blobB)">
      <animate attributeName="cx" values="900;660;900" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;310;250" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="390" rx="330" ry="120" fill="#b03a24" opacity="0.55">
      <animate attributeName="cx" values="600;400;780;600" dur="19s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- sunset sun glow + mountain/pine silhouette : echoes the profile picture -->
  <ellipse cx="600" cy="215" rx="430" ry="150" fill="url(#sunGlow)" opacity="0.55">
    <animate attributeName="opacity" values="0.45;0.68;0.45" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M0,420 L0,352 L70,318 L130,344 L210,296 L290,344 L370,308 L450,348 L530,312 L610,350 L690,308 L770,348 L850,312 L930,348 L1010,310 L1090,346 L1200,318 L1200,420 Z" fill="#070818" opacity="0.92"/>
  <g fill="#070818">
    <path d="M112,356 l16,-30 l16,30 Z"/>
    <path d="M292,348 l20,-38 l20,38 Z"/>
    <path d="M512,352 l16,-30 l16,30 Z"/>
    <path d="M752,348 l20,-38 l20,38 Z"/>
    <path d="M972,350 l16,-30 l16,30 Z"/>
  </g>

  <!-- rising particles : mk4 particle-loader vibe -->
  <g fill="#fde9e0">
    <circle cx="140" cy="400" r="3" opacity="0">
      <animate attributeName="cy" values="400;40" dur="9s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="400" r="2.4" opacity="0">
      <animate attributeName="cy" values="400;60" dur="11s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="400" r="3.4" opacity="0">
      <animate attributeName="cy" values="400;30" dur="10s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="10s" begin="-6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="400" r="2.2" opacity="0">
      <animate attributeName="cy" values="400;70" dur="12s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="12s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="400" r="3" opacity="0">
      <animate attributeName="cy" values="400;50" dur="9.5s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="9.5s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="400" r="2.6" opacity="0">
      <animate attributeName="cy" values="400;40" dur="11.5s" begin="-4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11.5s" begin="-4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="400" r="3.2" opacity="0">
      <animate attributeName="cy" values="400;60" dur="10.5s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="10.5s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="400" r="2.4" opacity="0">
      <animate attributeName="cy" values="400;45" dur="12.5s" begin="-8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0" dur="12.5s" begin="-8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title with violet glow : fades in after the intro loader -->
  <text x="600" y="208" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="88" font-weight="700" letter-spacing="14" fill="#fff8f2" filter="url(#textGlow)" opacity="0">ABHIRAM UNNI
    <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.9s" fill="freeze"/>
  </text>
  <!-- shimmer sweep across the title -->
  <rect width="1200" height="420" fill="url(#sweep)" mask="url(#titleMask)"/>

  <!-- subtitle : fades in after the intro loader -->
  <text x="600" y="272" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" letter-spacing="10" fill="#f5ddd0" opacity="0">FULL-STACK DEVELOPER
    <animate attributeName="opacity" values="0;1" begin="3.0s" dur="0.8s" fill="freeze"/>
  </text>
  <text x="600" y="318" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" letter-spacing="5" fill="#8a7a72" opacity="0">CRAFTING ANIMATED WEB EXPERIENCES
    <animate attributeName="opacity" values="0;1" begin="3.2s" dur="0.8s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.5;1" begin="4.2s" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- INTRO LOADER : plays once on every profile visit, then reveals the hero -->
  <g>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.82;1" dur="3.4s" fill="freeze"/>
    <rect width="1200" height="420" fill="#0c0d29"/>
    <circle cx="600" cy="176" r="46" fill="none" stroke="#33231f" stroke-width="6"/>
    <circle cx="600" cy="176" r="46" fill="none" stroke="url(#blobB)" stroke-width="6" stroke-linecap="round" stroke-dasharray="72 217">
      <animateTransform attributeName="transform" type="rotate" from="0 600 176" to="360 600 176" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="272" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" letter-spacing="10" fill="#f5ddd0" opacity="0">ABHIRAM UNNI
      <animate attributeName="opacity" values="0;1" begin="0.25s" dur="0.6s" fill="freeze"/>
    </text>
    <text x="600" y="306" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" letter-spacing="7" fill="#8a7a72" opacity="0">LOADING PROFILE
      <animate attributeName="opacity" values="0;1" begin="0.45s" dur="0.6s" fill="freeze"/>
    </text>
    <rect x="450" y="330" width="300" height="6" rx="3" fill="#33231f"/>
    <rect x="450" y="330" width="0" height="6" rx="3" fill="url(#blobB)">
      <animate attributeName="width" values="0;300" dur="2.4s" fill="freeze"/>
    </rect>
  </g>
</svg>
