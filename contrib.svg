      <animate attributeName="opacity" values="1;0.45;1" dur="1.6s" repeatCount="indefinite"/>
    </text>
    <rect x="400" y="62" width="400" height="8" rx="4" fill="#331016"/>
    <rect x="400" y="62" width="0" height="8" rx="4" fill="url(#cbar)">
      <animate attributeName="width" values="0;400" dur="2.4s" fill="freeze"/>
    </rect>
    <circle cx="560" cy="100" r="5" fill="#ff5d73">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.00s" repeatCount="indefinite"/>
    </circle>
    <circle cx="585" cy="100" r="5" fill="#ff5d73">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="100" r="5" fill="#ff5d73">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="635" cy="100" r="5" fill="#ff5d73">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.45s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="100" r="5" fill="#ff5d73">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.60s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>