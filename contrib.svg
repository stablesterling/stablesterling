<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <linearGradient id="cbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a4132e"/>
      <stop offset="100%" stop-color="#ff5d73"/>
    </linearGradient>
  </defs>
  <g>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="3.2s" fill="freeze"/>
