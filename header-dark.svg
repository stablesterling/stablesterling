<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <!-- v8 "professional" header — DARK theme. SMIL animation only, no JS/CSS. -->
  <defs>
    <linearGradient id="hbgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="hgoldD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a25e"/>
      <stop offset="100%" stop-color="#e8cf9a"/>
    </linearGradient>
    <linearGradient id="hsweepD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1.5 0; 1.5 0" dur="1.4s" begin="2.2s" fill="freeze"/>
    </linearGradient>
    <pattern id="hgridD" width="100" height="60" patternUnits="userSpaceOnUse">
      <path d="M100,0 H0 V60" fill="none" stroke="#c9a25e" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <mask id="hnameMaskD">
      <text x="600" y="232" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="84" font-weight="700" letter-spacing="12" fill="#ffffff">ABHIRAM UNNI</text>
    </mask>
  </defs>

  <rect width="1200" height="420" fill="url(#hbgD)"/>
  <rect width="1200" height="420" fill="url(#hgridD)"/>

  <!-- faint drifting code symbols : slow SMIL drift -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#c9a25e" opacity="0.15">
    <text x="110" y="130" font-size="46">{
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -26; 0 0" dur="18s" repeatCount="indefinite"/>
    </text>
    <text x="210" y="330" font-size="38">}
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 22; 0 0" dur="21s" begin="-7s" repeatCount="indefinite"/>
    </text>
    <text x="980" y="110" font-size="40">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -20; 0 0" dur="16s" begin="-4s" repeatCount="indefinite"/>
    </text>
    <text x="1060" y="330" font-size="44">;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 24; 0 0" dur="19s" begin="-11s" repeatCount="indefinite"/>
    </text>
    <text x="420" y="80" font-size="34">( )
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -18; 0 0" dur="22s" begin="-9s" repeatCount="indefinite"/>
    </text>
    <text x="760" y="360" font-size="36">=&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 20; 0 0" dur="17s" begin="-2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ONE-SHOT loader : thin gold line sweeps once, then fades away. No spinner. -->
  <g>
    <rect x="440" y="148" width="320" height="3" rx="1.5" fill="#1a2135"/>
    <rect x="440" y="148" width="0" height="3" rx="1.5" fill="url(#hgoldD)">
      <animate attributeName="width" values="0;320" dur="1.5s" fill="freeze"/>
    </rect>
    <animate attributeName="opacity" values="1;0" dur="0.4s" begin="1.7s" fill="freeze"/>
  </g>

  <!-- name : fades in after the loader, with a single shimmer sweep -->
  <text x="600" y="232" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="84" font-weight="700" letter-spacing="12" fill="#f5f2ea" opacity="0">ABHIRAM UNNI
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.9s" fill="freeze"/>
  </text>
  <rect width="1200" height="420" fill="url(#hsweepD)" mask="url(#hnameMaskD)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.15s" fill="freeze"/>
  </rect>

  <!-- subtitle -->
  <rect x="540" y="258" width="120" height="2" fill="#c9a25e" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="0.8s" begin="2.7s" fill="freeze"/>
  </rect>
  <text x="600" y="300" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="25" letter-spacing="11" fill="#c9a25e" opacity="0">FULL-STACK WEB DEVELOPER
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.8s" fill="freeze"/>
  </text>
  <text x="600" y="338" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" letter-spacing="6" fill="#8b93a7" opacity="0">PHP &#183; PYTHON &#183; JAVASCRIPT &#183; CLOUD &amp; DEVOPS
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="3.1s" fill="freeze"/>
  </text>
</svg>
